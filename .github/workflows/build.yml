name: Bloqbit Build

on:
    push:
        branches: ["**"]
    workflow_dispatch:

jobs:
    build:
        strategy:
            matrix:
                include:
                    - name: Windows
                      os: windows-latest
                      rid: win-x64

                    - name: Linux
                      os: ubuntu-latest
                      rid: linux-x64

                    - name: MacOS
                      os: macos-latest
                      rid: osx-x64

        name: Build for ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET 9
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "9.0.x"

            - name: Publish for ${{ matrix.rid }}
              run: dotnet publish Bloqbit.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -o ./publish/${{ matrix.rid }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: bloqbit-${{ matrix.name }}
                  path: ./publish/${{ matrix.rid }}

    package:
        name: Package builds
        runs-on: ubuntu-latest
        needs: [build]

        steps:
            - name: Download Windows
              uses: actions/download-artifact@v4
              with:
                  name: bloqbit-Windows
                  path: ./merged/win-x64

            - name: Download Linux
              uses: actions/download-artifact@v4
              with:
                  name: bloqbit-Linux
                  path: ./merged/linux-x64

            - name: Download MacOS
              uses: actions/download-artifact@v4
              with:
                  name: bloqbit-MacOS
                  path: ./merged/osx-x64

            - name: Combine outputs
              run: |
                  mkdir -p ./final
                  cp -r ./merged/* ./final/

            - name: Create archive
              run: |
                  apt-get update -y && apt-get install -y zip || true
                  zip -r Bloqbit-Output.zip final

            - name: Upload merged artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Bloqbit-Output
                  path: Bloqbit-Output.zip

            - name: Cleanup artifacts
              if: always()
              run: |
                  rm -rf ./merged ./final Bloqbit-Output.zip
